<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Île-aux-Moines 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: plein écran 3D ; carnet de lieux à gauche, fiche du lieu en bas, commandes en haut à droite */
:root{
  --ink:#12303a; --ink-soft:#4b6670; --paper:rgba(251,248,240,.92); --paper-solid:#fbf8f0;
  --line:rgba(18,48,58,.14); --accent:#c8472f; --sea:#1f6f86; --sky:#bfe0ea;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-size:14px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(10,40,50,.14)}
#brand{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:14px 16px 12px;width:min(280px,calc(100vw - 32px));box-sizing:border-box;z-index:3}
#brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
#brand p{margin:4px 0 0;color:var(--ink-soft);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#brand p.by{text-transform:none;letter-spacing:0;font-size:12.5px;font-style:italic;color:var(--ink);margin-top:6px}
#places{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 260px);overflow:auto}
#places button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;font-size:13.5px}
#places button:hover{background:rgba(31,111,134,.09)}
#places button:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
#places button[aria-current="true"]{background:rgba(200,71,47,.12);font-weight:600}
#places .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sea)}
#places .dot.star{background:var(--accent);box-shadow:0 0 0 3px rgba(200,71,47,.2)}
#places .kind{margin-left:auto;color:var(--ink-soft);font-size:11px}
#tools{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:3;max-width:calc(100vw - 32px)}
#tools button{font:500 13px var(--f-ui);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 16px rgba(10,40,50,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tools button:hover{border-color:var(--sea)}
#tools button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
#tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper-solid);border-color:var(--ink)}
#tide{display:flex;align-items:center;gap:8px;font:500 13px var(--f-ui);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 14px;box-shadow:0 4px 16px rgba(10,40,50,.12)}
#tide input{width:110px;accent-color:var(--sea)}
#tideVal{font-variant-numeric:tabular-nums;min-width:6.5em;color:var(--ink-soft);font-size:12px}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 32px));box-sizing:border-box;padding:14px 18px 16px;z-index:3}
#card h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 28px 2px 0;text-wrap:balance}
#card .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
#card p{margin:6px 0 0;line-height:1.5;max-width:65ch}
#card .close{position:absolute;right:10px;top:8px;all:unset;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-soft);padding:4px 8px;border-radius:6px}
#card .close:focus-visible{outline:2px solid var(--sea)}
#help{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:9px 12px;font-size:12px;color:var(--ink-soft);line-height:1.55;z-index:2;max-width:250px}
#help b{color:var(--ink);font-weight:600}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.lbl span{font:600 12px var(--f-ui);color:var(--ink);background:var(--paper-solid);padding:3px 8px;border-radius:999px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl i{width:1.5px;height:14px;background:var(--ink);opacity:.55}
.lbl.star span{background:var(--accent);color:#fff;border-color:transparent}
.lbl.small span{font-weight:500;font-size:11px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--ink);background:var(--sky);z-index:9;transition:opacity .6s}
@media (max-width:720px){
  #brand{width:auto;right:16px;padding:10px 12px}
  #brand h1{font-size:20px}
  #places{flex-direction:row;overflow-x:auto;max-height:none;gap:4px;padding-bottom:2px}
  #places button{width:auto;white-space:nowrap;padding:5px 9px;background:rgba(31,111,134,.07)}
  #places .kind{display:none}
  #tools{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;left:16px;justify-content:center}
  #help{display:none}
  #card{bottom:calc(120px + env(safe-area-inset-bottom,0px));padding:10px 14px 12px}
  #card h2{font-size:18px}
  #card p{font-size:13px;line-height:1.45}
}
@media (prefers-reduced-motion:reduce){#loading{transition:none}}
</style>

<canvas id="scene" tabindex="0" aria-label="Vue 3D de l'Île-aux-Moines"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="loading">Île-aux-Moines…</div>

<section id="brand" class="panel">
  <h1>Île-aux-Moines</h1>
  <p>Golfe du Morbihan · vue 3D</p>
  <p class="by">By Christine Viana - AFPA Auray 2026</p>
  <ul id="places" aria-label="Lieux"></ul>
</section>

<div id="tools">
  <button id="btnFly" type="button" aria-pressed="false">Survol</button>
  <button id="btnHome" type="button">Vue d'ensemble</button>
  <button id="btnLabels" type="button" aria-pressed="true">Étiquettes</button>
  <label id="tide" for="tideRange">Marée <input id="tideRange" type="range" min="0" max="100" value="100"><span id="tideVal">pleine mer</span></label>
</div>

<section id="card" class="panel" hidden aria-live="polite">
  <button class="close" type="button" aria-label="Fermer la fiche">×</button>
  <div class="tag" id="cardTag"></div>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
</section>

<div id="help" class="panel"><b>Glisser</b> : tourner · <b>Clic droit</b> ou <b>2 doigts</b> : se déplacer · <b>Molette</b> ou <b>pincer</b> : zoom · <b>Flèches / ZQSD</b> : avancer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const HM_SRC="hm.png";
const TEX_SRC="tex.jpg";
// ---- géométrie de référence : coordonnées de la carte de la mairie (px) ----
const S=0.85, CX=288, CY=497.5, Y0=95, HMW=576, HMH=805, LAND_MAX=6.0, SEA_MIN=-4.0;
const toX=x=>(x-CX)*S, toZ=y=>(y-CY)*S;
const W3=HMW*S, D3=HMH*S;

const PLACES=[
 {id:"goret",name:"Plage de Goret",kind:"Plage",star:true,x:158,y:469,h:1,tag:"Site étudié",
  text:"Une anse abritée dont l'eau est réputée la plus chaude de l'île. Son nom vient du breton gored, « pêcherie » : deux digues en pierres sèches y formaient un piège à poissons médiéval. Baissez la marée pour voir réapparaître les pierres du barrage."},
 {id:"creizic",name:"Île de Creïzic",kind:"Îlot",x:30,y:556,h:1.2,tag:"Face à Goret",
  text:"3,5 hectares. Une maison y est construite vers 1892 pour l'ostréiculture ; les ostréiculteurs partent en 1945. Restaurée à partir de 1990, l'île est inventoriée avec Bretagne Vivante et sert de lieu de repos aux oiseaux. Cinq moutons d'Ouessant y pâturent toute l'année."},
 {id:"bourg",name:"Le Bourg",kind:"Village",x:280,y:300,h:3,tag:"Cœur de l'île",
  text:"Le bourg occupe le carrefour des trois branches de l'île, autour de l'église et des ruelles de maisons blanches aux toits d'ardoise."},
 {id:"port",minor:true,name:"Le Port",kind:"Embarcadère",x:233,y:228,h:1,tag:"Arrivée",
  text:"L'embarcadère où accostent les bateaux venus de Port-Blanc, sur la commune de Baden : la traversée ne dure que quelques minutes."},
 {id:"kergonan",minor:true,name:"Cromlec'h de Kergonan",kind:"Mégalithe",x:224,y:357,h:2,tag:"Préhistoire",
  text:"Un vaste demi-cercle de menhirs dressés, l'un des plus grands ensembles de ce type en France."},
 {id:"kerno",minor:true,name:"Dolmen de Kerno",kind:"Mégalithe",x:160,y:521,h:2,tag:"Préhistoire",
  text:"Un dolmen, chambre funéraire faite de grandes dalles posées sur des pierres dressées, au sud du village de Kerno."},
 {id:"grandeplage",minor:true,name:"Grande Plage",kind:"Plage",x:224,y:262,h:1,tag:"Plage",
  text:"La plage proche du port et du bourg, sur la façade ouest de l'île."},
 {id:"vran",name:"Anse du Vran",kind:"Plage",x:320,y:410,h:1,tag:"Plage",
  text:"Une longue anse sableuse ouverte vers le sud-est, au creux du bras de Brouël."},
 {id:"trech",name:"Pointe du Trec'h",kind:"Pointe",x:358,y:153,h:2,tag:"Pointe nord",
  text:"L'extrémité nord de l'île, face au cœur du Golfe."},
 {id:"brouel",name:"Pointe de Brouël",kind:"Pointe",x:498,y:430,h:2,tag:"Pointe est",
  text:"Le bout du bras est de l'île, prolongé par les petits îlots de Brouël."},
 {id:"nioul",name:"Pointe du Nioul",kind:"Pointe",x:96,y:832,h:2,tag:"Pointe sud",
  text:"L'extrême sud de l'île, une longue pointe étroite."},
 {id:"penhap",minor:true,name:"Penhap",kind:"Village",x:176,y:702,h:2,tag:"Village",
  text:"Un hameau du sud de l'île, entre l'Anse du Guip et la Pointe de Brannec."},
 {id:"portblanc",name:"Port-Blanc (Baden)",kind:"Continent",x:115,y:150,h:2,tag:"Départ des bateaux",
  text:"Sur le continent, l'embarcadère de Port-Blanc relie l'île toute l'année."}
];
const VILLAGES=[[280,300,30,170],[236,232,11,26],[318,282,11,18],[338,346,10,14],[214,360,9,12],[211,478,12,26],[108,692,10,18],[176,702,9,14],[158,770,8,10],[430,356,8,9],[402,392,7,7],[110,145,22,40],[60,120,18,22]];

// ---- chargement des images ----
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
const MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&Math.min(screen.width,screen.height)<900);
function fail(msg){let l=document.getElementById('loading');if(!l){l=document.createElement('div');l.id='loading';document.body.appendChild(l);}if(l){l.style.opacity=1;l.style.padding='24px';l.style.textAlign='center';l.style.fontSize='18px';l.textContent=msg;}}
if(typeof THREE==='undefined'){fail("Le moteur 3D n'a pas pu se charger. Vérifiez la connexion internet, puis rechargez la page.");}
else Promise.all([loadImg(HM_SRC),loadImg(TEX_SRC)]).then(([hmImg,texImg])=>{try{start(hmImg,texImg);}catch(err){fail("Cet appareil n'arrive pas à afficher la 3D ("+err.message+").");}}).catch(()=>fail("La carte n'a pas pu se charger."));

function start(hmImg,texImg){
  const c=document.createElement('canvas');c.width=HMW;c.height=HMH;const cx=c.getContext('2d');cx.drawImage(hmImg,0,0);
  const hd=cx.getImageData(0,0,HMW,HMH).data;
  const ct=document.createElement('canvas');ct.width=texImg.width;ct.height=texImg.height;const ctx2=ct.getContext('2d');ctx2.drawImage(texImg,0,0);
  const td=ctx2.getImageData(0,0,ct.width,ct.height).data;
  const hv=(i,j)=>{i=Math.max(0,Math.min(HMW-1,i));j=Math.max(0,Math.min(HMH-1,j));const v=hd[(j*HMW+i)*4];return v>=128?(v-128)/127*LAND_MAX:(v-128)/128*-SEA_MIN;};
  function heightAt(x,y){ // px de la carte
    const fx=x-0.5, fy=y-Y0-0.5, i=Math.floor(fx), j=Math.floor(fy), a=fx-i, b=fy-j;
    let h=hv(i,j)*(1-a)*(1-b)+hv(i+1,j)*a*(1-b)+hv(i,j+1)*(1-a)*b+hv(i+1,j+1)*a*b;
    // estran de l'anse de Goret : fond en pente douce qui découvre à marée basse
    const dg=Math.hypot((x-150)/15,(y-469)/24);
    if(dg<1&&h<0){const target=-0.2-1.15*dg; const w=1-Math.max(0,Math.min(1,(dg-0.75)/0.25)); h=h*(1-w)+Math.max(h,target)*w;}
    return h;
  }
  function texAt(x,y){const i=Math.floor(x/HMW*ct.width), j=Math.floor((y-Y0)/HMH*ct.height);const k=(Math.max(0,Math.min(ct.height-1,j))*ct.width+Math.max(0,Math.min(ct.width-1,i)))*4;return [td[k],td[k+1],td[k+2]];}

  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:!MOBILE,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,MOBILE?1.5:2));
  canvas.addEventListener('webglcontextlost',ev=>{ev.preventDefault();fail("L'affichage 3D s'est interrompu (mémoire du téléphone). Rechargez la page.");});
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=MOBILE?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  const scene=new THREE.Scene();
  const skyCol=new THREE.Color(0xbfe0ea);
  scene.background=skyCol; scene.fog=new THREE.Fog(skyCol,700,1900);
  const camera=new THREE.PerspectiveCamera(42,1,0.5,4000);

  // lumière
  scene.add(new THREE.HemisphereLight(0xeaf6ff,0x5a6a4a,0.75));
  const sun=new THREE.DirectionalLight(0xfff1dc,1.0);
  sun.position.set(-260,320,180); sun.castShadow=true;
  sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);
  Object.assign(sun.shadow.camera,{left:-380,right:380,top:380,bottom:-380,near:10,far:1200});
  sun.shadow.bias=-0.0006; scene.add(sun);

  // terrain
  const SEG_X=MOBILE?191:287, SEG_Z=MOBILE?268:402;
  const geo=new THREE.PlaneGeometry(W3,D3,SEG_X,SEG_Z); geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let k=0;k<pos.count;k++){
    const X=pos.getX(k), Z=pos.getZ(k);
    pos.setY(k, heightAt(X/S+CX, Z/S+CY));
  }
  geo.computeVertexNormals();
  const tex=new THREE.Texture(texImg); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8; tex.needsUpdate=true;
  const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:0.95,metalness:0}));
  terrain.receiveShadow=true; scene.add(terrain);
  // fond marin au-delà de la carte
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshStandardMaterial({color:0x2a6e82,roughness:1}));
  floor.rotation.x=-Math.PI/2; floor.position.y=SEA_MIN+0.05; scene.add(floor);
  const floorHole=new THREE.Mesh(new THREE.PlaneGeometry(W3-2,D3-2),new THREE.MeshBasicMaterial({visible:false})); // repère

  // mer
  const nc=document.createElement('canvas'); nc.width=nc.height=256; const nctx=nc.getContext('2d'); const nid=nctx.createImageData(256,256);
  for(let y=0;y<256;y++)for(let x=0;x<256;x++){
    const t=2*Math.PI/256;
    const dx=Math.cos(x*t*3+Math.sin(y*t*2)*1.5)*0.5+Math.cos((x+y)*t*5)*0.3+Math.sin((x*2-y)*t*4)*0.2;
    const dy=Math.cos(y*t*4+Math.sin(x*t*3)*1.2)*0.5+Math.sin((x-y)*t*6)*0.3+Math.cos((x+2*y)*t*3)*0.2;
    const k=(y*256+x)*4; nid.data[k]=128+dx*55; nid.data[k+1]=128+dy*55; nid.data[k+2]=255; nid.data[k+3]=255;
  }
  nctx.putImageData(nid,0,0);
  const nTex=new THREE.CanvasTexture(nc); nTex.wrapS=nTex.wrapT=THREE.RepeatWrapping; nTex.repeat.set(60,60);
  const seaMat=new THREE.MeshStandardMaterial({color:0x1d7690,transparent:true,opacity:0.8,roughness:0.18,metalness:0.05,normalMap:nTex,normalScale:new THREE.Vector2(0.35,0.35),depthWrite:false});
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),seaMat); sea.rotation.x=-Math.PI/2; sea.renderOrder=2; scene.add(sea);
  const TIDE_HIGH=0.15, TIDE_LOW=-1.6;
  let tideLevel=TIDE_HIGH; sea.position.y=tideLevel;

  // ---- matériaux & helpers ----
  const rnd=(()=>{let s=20260707;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};})();
  const wallMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.9});
  const roofMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.7});
  const stoneMat=new THREE.MeshStandardMaterial({color:0x8d8a80,roughness:1});
  function prismGeo(){ // toit à deux pans, faîtage selon X
    const g=new THREE.BufferGeometry();
    const v=[-.5,0,-.5, .5,0,-.5, .5,1,0,  -.5,0,-.5, .5,1,0, -.5,1,0,
             .5,0,.5, -.5,0,.5, -.5,1,0,  .5,0,.5, -.5,1,0, .5,1,0,
             -.5,0,.5, -.5,0,-.5, -.5,1,0,  .5,0,-.5, .5,0,.5, .5,1,0,
             -.5,0,-.5, -.5,0,.5, .5,0,.5,  -.5,0,-.5, .5,0,.5, .5,0,-.5];
    g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.computeVertexNormals(); return g;
  }
  const boxG=new THREE.BoxGeometry(1,1,1); boxG.translate(0,0.5,0);
  const roofG=prismGeo();
  const isLand=(x,y,min)=>heightAt(x,y)>min;

  // maisons
  const houses=[];
  function tryHouse(x,y){
    if(!isLand(x,y,0.9)) return false;
    for(const h of houses){ if((h.x-x)**2+(h.y-y)**2<3.2) return false; }
    houses.push({x,y,r:rnd()*Math.PI,w:1.1+rnd()*0.9,d:0.75+rnd()*0.35,hgt:0.8+rnd()*0.5}); return true;
  }
  for(const [vx,vy,r,n] of VILLAGES){ let made=0,tries=0; while(made<n&&tries<n*30){tries++; const a=rnd()*Math.PI*2, d=Math.sqrt(rnd())*r; if(tryHouse(vx+Math.cos(a)*d, vy+Math.sin(a)*d)) made++; } }
  for(let t=0,m=0;t<4000&&m<110;t++){ const x=60+rnd()*450, y=140+rnd()*700; if(heightAt(x,y)>1.6 && tryHouse(x,y)) m++; }
  const HN=houses.length;
  const walls=new THREE.InstancedMesh(boxG,wallMat,HN), roofs=new THREE.InstancedMesh(roofG,roofMat,HN);
  walls.castShadow=roofs.castShadow=true; walls.receiveShadow=true;
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), sc=new THREE.Vector3(), p3=new THREE.Vector3(), col=new THREE.Color();
  const wallCols=[0xf5f2ea,0xf1ece0,0xece7da,0xe6e0d2,0xd9d2c3,0xf7f4ee];
  houses.forEach((h,i)=>{
    const y0=heightAt(h.x,h.y)-0.15;
    e.set(0,h.r,0); q.setFromEuler(e);
    m4.compose(p3.set(toX(h.x),y0,toZ(h.y)),q,sc.set(h.w,h.hgt,h.d)); walls.setMatrixAt(i,m4);
    walls.setColorAt(i,col.setHex(wallCols[i%wallCols.length]));
    m4.compose(p3.set(toX(h.x),y0+h.hgt,toZ(h.y)),q,sc.set(h.w*1.04,0.55,h.d*1.12)); roofs.setMatrixAt(i,m4);
    roofs.setColorAt(i,col.setHex(rnd()<0.85?0x46505a:0x5b6670));
  });
  scene.add(walls,roofs);

  // arbres (pins maritimes) dans les zones boisées de la texture
  const trees=[];
  for(let t=0;t<60000&&trees.length<(MOBILE?1200:2600);t++){

    lbls.forEach(l=>l.btn.setAttribute('aria-current',l.pl===pl?'true':'false'));
    document.getElementById('cardTag').textContent=pl.tag; document.getElementById('cardTitle').textContent=pl.name; document.getElementById('cardText').textContent=pl.text; card.hidden=false;
    const v=viewFor(pl); flyTo(v.pos,v.tgt);
  }
  card.querySelector('.close').addEventListener('click',()=>{card.hidden=true;lbls.forEach(l=>l.btn.setAttribute('aria-current','false'));});
  let showLabels=true;
  const btnFly=document.getElementById('btnFly'), btnHome=document.getElementById('btnHome'), btnLabels=document.getElementById('btnLabels');
  btnFly.addEventListener('click',()=>{tour?stopTour():startTour();});
  btnHome.addEventListener('click',()=>{card.hidden=true;flyTo(HOME.pos,HOME.tgt);});
  btnLabels.addEventListener('click',()=>{showLabels=!showLabels;btnLabels.setAttribute('aria-pressed',String(showLabels));labelsEl.hidden=!showLabels;});
  const tideRange=document.getElementById('tideRange'), tideVal=document.getElementById('tideVal');
  function setTide(){const t=tideRange.value/100; tideLevel=TIDE_LOW+(TIDE_HIGH-TIDE_LOW)*t; sea.position.y=tideLevel;
    tideVal.textContent=t>0.85?'pleine mer':t<0.15?'basse mer':t>0.5?'mi-marée haute':'mi-marée basse';}
  tideRange.addEventListener('input',setTide); setTide();

  // ---- boucle ----
  function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize); resize();
  const tmp=new THREE.Vector3(); let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(tween){const t=Math.min(1,(now-tween.start)/tween.dur),k=ease(t);
      camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k);
      const lift=Math.sin(Math.PI*k)*Math.min(120,tween.p0.distanceTo(tween.p1)*0.25); camera.position.y+=lift; if(t>=1)tween=null;}
    if(tour){const u=((now-tour.t0)/1000/90)%1; const p=tourCurve.getPointAt(u), ahead=tourCurve.getPointAt((u+0.02)%1);
      camera.position.copy(p); controls.target.set(ahead.x*0.6,0,ahead.z*0.6);}
    keyMove(dt);
    controls.update();
    if(!reduce){nTex.offset.x=(now*0.000012)%1; nTex.offset.y=(now*0.000007)%1;
      boats.forEach(b=>{const u=b.userData; b.position.y=Math.max(tideLevel,u.g)+Math.sin(now*0.0015+u.ph)*0.06*(tideLevel>u.g?1:0); b.rotation.z=Math.sin(now*0.001+u.ph)*0.04;});
      const pts=window.__ferryPts; const fu=(now/1000/40)%2; const s=fu<1?fu:2-fu; const fi=s*(pts.length-1), i0=Math.floor(fi), a=fi-i0;
      const P=pts[Math.min(i0,pts.length-1)].clone().lerp(pts[Math.min(i0+1,pts.length-1)],a); ferry.position.set(P.x,tideLevel+0.05,P.z);
      const nxt=pts[Math.min(i0+1,pts.length-1)]; ferry.rotation.y=Math.atan2(-(nxt.z-P.z),(nxt.x-P.x))+(fu<1?0:Math.PI);
      avatarArm.rotation.z=-0.35+Math.sin(now*0.004)*0.25; const ring=beacon.getObjectByName('ring'); const pulse=1+((now/1400)%1)*0.9; ring.scale.set(pulse,pulse,pulse); ring.material.opacity=0.75*(1-((now/1400)%1));
    } else { boats.forEach(b=>{b.position.y=Math.max(tideLevel,b.userData.g);}); }
    renderer.render(scene,camera);
    if(showLabels){const w=window.innerWidth,h=window.innerHeight; const camDist=camera.position.distanceTo(controls.target);
      lbls.forEach(l=>{tmp.copy(l.v).project(camera); const dd=camera.position.distanceTo(l.v);
        const vis=tmp.z<1&&tmp.x>-1.1&&tmp.x<1.1&&tmp.y>-1.1&&tmp.y<1.1&&(l.pl.star||(l.pl.minor?dd<380:dd<Math.max(520,camDist*1.6)));
        if(!vis){l.el.style.display='none';return;} l.el.style.display='';
        l.el.style.left=((tmp.x+1)/2*w)+'px'; l.el.style.top=((1-tmp.y)/2*h)+'px'; l.el.style.zIndex=String(1000-Math.round(dd)); l.el.style.opacity=dd>700?0.6:1;});}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const ld=document.getElementById('loading'); ld.style.opacity=0; setTimeout(()=>ld.remove(),700);
  canvas.focus({preventScroll:true});
}
})();
</script>
