<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Île-aux-Moines 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: plein écran 3D ; carnet de lieux à gauche, fiche du lieu en bas, commandes en haut à droite */
:root{
  --ink:#12303a; --ink-soft:#4b6670; --paper:rgba(251,248,240,.92); --paper-solid:#fbf8f0;
  --line:rgba(18,48,58,.14); --accent:#c8472f; --sea:#1f6f86; --sky:#bfe0ea;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-size:14px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(10,40,50,.14)}
#brand{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:14px 16px 12px;width:min(280px,calc(100vw - 32px));box-sizing:border-box;z-index:3}
#brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
#brand p{margin:4px 0 0;color:var(--ink-soft);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#brand p.by{text-transform:none;letter-spacing:0;font-size:12.5px;font-style:italic;color:var(--ink);margin-top:6px}
#places{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 260px);overflow:auto}
#places button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;font-size:13.5px}
#places button:hover{background:rgba(31,111,134,.09)}
#places button:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
#places button[aria-current="true"]{background:rgba(200,71,47,.12);font-weight:600}
#places .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sea)}
#places .dot.star{background:var(--accent);box-shadow:0 0 0 3px rgba(200,71,47,.2)}
#places .kind{margin-left:auto;color:var(--ink-soft);font-size:11px}
#tools{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:3;max-width:calc(100vw - 32px)}
#tools button{font:500 13px var(--f-ui);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 16px rgba(10,40,50,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tools button:hover{border-color:var(--sea)}
#tools button:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
#tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper-solid);border-color:var(--ink)}
#tide{display:flex;align-items:center;gap:8px;font:500 13px var(--f-ui);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 14px;box-shadow:0 4px 16px rgba(10,40,50,.12)}
#tide input{width:110px;accent-color:var(--sea)}
#tideVal{font-variant-numeric:tabular-nums;min-width:6.5em;color:var(--ink-soft);font-size:12px}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 32px));box-sizing:border-box;padding:14px 18px 16px;z-index:3}
#card h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 28px 2px 0;text-wrap:balance}
#card .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
#card p{margin:6px 0 0;line-height:1.5;max-width:65ch}
#card .close{position:absolute;right:10px;top:8px;all:unset;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-soft);padding:4px 8px;border-radius:6px}
#card .close:focus-visible{outline:2px solid var(--sea)}
#help{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:9px 12px;font-size:12px;color:var(--ink-soft);line-height:1.55;z-index:2;max-width:250px}
#help b{color:var(--ink);font-weight:600}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.lbl span{font:600 12px var(--f-ui);color:var(--ink);background:var(--paper-solid);padding:3px 8px;border-radius:999px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lbl i{width:1.5px;height:14px;background:var(--ink);opacity:.55}
.lbl.star span{background:var(--accent);color:#fff;border-color:transparent}
.lbl.small span{font-weight:500;font-size:11px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--ink);background:var(--sky);z-index:9;transition:opacity .6s}
@media (max-width:720px){
  #brand{width:auto;right:16px;padding:10px 12px}
  #brand h1{font-size:20px}
  #places{flex-direction:row;overflow-x:auto;max-height:none;gap:4px;padding-bottom:2px}
  #places button{width:auto;white-space:nowrap;padding:5px 9px;background:rgba(31,111,134,.07)}
  #places .kind{display:none}
  #tools{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;left:16px;justify-content:center}
  #help{display:none}
  #card{bottom:calc(120px + env(safe-area-inset-bottom,0px));padding:10px 14px 12px}
  #card h2{font-size:18px}
  #card p{font-size:13px;line-height:1.45}
}
@media (prefers-reduced-motion:reduce){#loading{transition:none}}
</style>

<canvas id="scene" tabindex="0" aria-label="Vue 3D de l'Île-aux-Moines"></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="loading">Île-aux-Moines…</div>

<section id="brand" class="panel">
  <h1>Île-aux-Moines</h1>
  <p>Golfe du Morbihan · vue 3D</p>
  <p class="by">By Christine Viana - AFPA Auray 2026</p>
  <ul id="places" aria-label="Lieux"></ul>
</section>

<div id="tools">
  <button id="btnFly" type="button" aria-pressed="false">Survol</button>
  <button id="btnHome" type="button">Vue d'ensemble</button>
  <button id="btnLabels" type="button" aria-pressed="true">Étiquettes</button>
  <label id="tide" for="tideRange">Marée <input id="tideRange" type="range" min="0" max="100" value="100"><span id="tideVal">pleine mer</span></label>
</div>

<section id="card" class="panel" hidden aria-live="polite">
  <button class="close" type="button" aria-label="Fermer la fiche">×</button>
  <div class="tag" id="cardTag"></div>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
</section>

<div id="help" class="panel"><b>Glisser</b> : tourner · <b>Clic droit</b> ou <b>2 doigts</b> : se déplacer · <b>Molette</b> ou <b>pincer</b> : zoom · <b>Flèches / ZQSD</b> : avancer</div>

    [-0.14,0.14].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.04,8,6),eyeM); e.position.set(x,3.72,0.37); fig.add(e);
      const rim=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.012,6,20),frame); rim.scale.set(1.15,0.8,1); rim.position.set(x,3.72,0.4); fig.add(rim);});
    const bridge=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.08,4),frame); bridge.rotation.z=Math.PI/2; bridge.position.set(0,3.74,0.41); fig.add(bridge);
    [-1,1].forEach(sx=>{const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.36,4),frame); arm.rotation.x=Math.PI/2; arm.position.set(sx*0.27,3.73,0.24); fig.add(arm);});
    const lips=new THREE.Mesh(new THREE.TorusGeometry(0.075,0.022,6,12,Math.PI),lip); lips.rotation.z=Math.PI; lips.position.set(0,3.5,0.37); fig.add(lips);
    // bras gauche le long du corps, montre au poignet
    const armL=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.1,1.3,8),skin); armL.position.set(-0.56,2.38,0); armL.rotation.z=0.12; fig.add(armL);
    const sleeveL=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.35,10),polo); sleeveL.position.set(-0.52,2.9,0); sleeveL.rotation.z=0.12; fig.add(sleeveL);
    const watch=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.03,6,12),M(0x2a3640)); watch.rotation.x=Math.PI/2; watch.position.set(-0.62,1.85,0); fig.add(watch);
    // bras droit levé avec le fanion de guide
    avatarArm.position.set(0.5,3.0,0);
    const sleeveR=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.35,10),polo); sleeveR.position.y=0.12; avatarArm.add(sleeveR);
    const armR=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.1,1.2,8),skin); armR.position.y=0.75; avatarArm.add(armR);
    const handR=new THREE.Mesh(new THREE.SphereGeometry(0.12,10,8),skin); handR.position.y=1.38; avatarArm.add(handR);
    const stick=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,2.2,6),M(0x5b4632)); stick.position.y=2.2; avatarArm.add(stick);
    const flagG=new THREE.BufferGeometry(); flagG.setAttribute('position',new THREE.Float32BufferAttribute([0,3.25,0, 0,2.55,0, 1.1,2.9,0],3)); flagG.computeVertexNormals();
    avatarArm.add(new THREE.Mesh(flagG,M(0x2bb6c9,{side:THREE.DoubleSide})));
    avatarArm.rotation.z=-0.35; fig.add(avatarArm);
    fig.scale.setScalar(1.35);
    fig.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
    fig.rotation.y=-Math.PI/2+0.5; // tournée vers la pêcherie, un peu vers le visiteur
    beacon.add(fig);
    const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.6,48),new THREE.MeshBasicMaterial({color:0xc8472f,transparent:true,opacity:0.7,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=0.25;ring.name='ring';beacon.add(ring);
    beacon.position.set(toX(162),heightAt(162,469)+0.05,toZ(469)); scene.add(beacon);})();

  // ---- caméra & contrôles ----
  const controls=new THREE.OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.dampingFactor=0.08; controls.screenSpacePanning=false;
  controls.minDistance=12; controls.maxDistance=1300; controls.maxPolarAngle=Math.PI*0.47;
  controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
  controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
  const HOME={pos:new THREE.Vector3(-400,420,560),tgt:new THREE.Vector3(-70,0,30)};
  camera.position.copy(HOME.pos); controls.target.copy(HOME.tgt);

  let tween=null;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function flyTo(pos,tgt,dur=1800){stopTour();const p0=camera.position.clone(),t0=controls.target.clone();
    if(reduce){camera.position.copy(pos);controls.target.copy(tgt);return;}
    tween={p0,t0,p1:pos.clone(),t1:tgt.clone(),start:performance.now(),dur};}
  function viewFor(pl){const tx=toX(pl.x), tz=toZ(pl.y), ty=Math.max(0,heightAt(pl.x,pl.y));
    const tgt=new THREE.Vector3(tx,ty,tz);
    const dir=new THREE.Vector3(tx-toX(330),0,tz-toZ(480)); if(dir.lengthSq()<1)dir.set(-1,0,1); dir.normalize();
    const dist=pl.id==='bourg'||pl.id==='portblanc'?70:pl.id==='creizic'?55:45;
    return {pos:new THREE.Vector3(tx+dir.x*dist,ty+dist*0.62,tz+dir.z*dist),tgt};}

  // survol
  let tour=null;
  const tourPts=[[-120,60,-300],[60,55,-330],[200,50,-160],[240,45,-30],[120,40,60],[-20,35,40],[-150,30,-20],[-210,35,120],[-130,40,260],[-60,45,330],[60,55,240],[40,70,-60],[-120,60,-300]].map(a=>new THREE.Vector3(...a));
  const tourCurve=new THREE.CatmullRomCurve3(tourPts,true,'centripetal');
  function startTour(){tween=null;tour={t0:performance.now()};btnFly.setAttribute('aria-pressed','true');}
  function stopTour(){if(tour){tour=null;btnFly.setAttribute('aria-pressed','false');}}
  controls.addEventListener('start',()=>{stopTour();tween=null;});

  // clavier
  const keys={};
  window.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;keys[ev.key.toLowerCase()]=true;});
  window.addEventListener('keyup',ev=>{keys[ev.key.toLowerCase()]=false;});
  function keyMove(dt){
    const f=(keys['arrowup']||keys['z']||keys['w']?1:0)-(keys['arrowdown']||keys['s']?1:0);
    const r=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['q']||keys['a']?1:0);
    const ud=(keys['e']||keys['pageup']?1:0)-(keys['pagedown']||keys['c']?1:0);
    if(!f&&!r&&!ud)return; stopTour(); tween=null;
    const dist=camera.position.distanceTo(controls.target); const sp=Math.max(15,dist*0.9)*dt;
    const fw=new THREE.Vector3().subVectors(controls.target,camera.position); fw.y=0; fw.normalize();
    const rt=new THREE.Vector3().crossVectors(fw,new THREE.Vector3(0,1,0));
    const mv=fw.multiplyScalar(f*sp).add(rt.multiplyScalar(r*sp)); mv.y=ud*sp*0.6;
    camera.position.add(mv); controls.target.add(new THREE.Vector3(mv.x,0,mv.z));
  }

  // ---- étiquettes & liste ----
  const labelsEl=document.getElementById('labels'), list=document.getElementById('places');
  const lbls=PLACES.map(pl=>{
    const d=document.createElement('div'); d.className='lbl'+(pl.star?' star':'')+(pl.kind==='Mégalithe'||pl.kind==='Pointe'?' small':''); d.innerHTML='<span></span><i></i>'; d.firstChild.textContent=pl.name;
    d.addEventListener('click',()=>select(pl)); labelsEl.appendChild(d);
    const li=document.createElement('li'); const b=document.createElement('button'); b.type='button';
    b.innerHTML='<span class="dot'+(pl.star?' star':'')+'"></span><span class="nm"></span><span class="kind"></span>';
    b.querySelector('.nm').textContent=pl.name; b.querySelector('.kind').textContent=pl.kind; b.addEventListener('click',()=>select(pl)); li.appendChild(b); list.appendChild(li);
    const y=Math.max(0.3,heightAt(pl.x,pl.y))+pl.h+(pl.id==='goret'?6.5:2);
    return {pl,el:d,btn:b,v:new THREE.Vector3(toX(pl.x),y,toZ(pl.y))};
  });
  const card=document.getElementById('card');
  function select(pl){
    lbls.forEach(l=>l.btn.setAttribute('aria-current',l.pl===pl?'true':'false'));
    document.getElementById('cardTag').textContent=pl.tag; document.getElementById('cardTitle').textContent=pl.name; document.getElementById('cardText').textContent=pl.text; card.hidden=false;
    const v=viewFor(pl); flyTo(v.pos,v.tgt);
  }
  card.querySelector('.close').addEventListener('click',()=>{card.hidden=true;lbls.forEach(l=>l.btn.setAttribute('aria-current','false'));});
  let showLabels=true;
  const btnFly=document.getElementById('btnFly'), btnHome=document.getElementById('btnHome'), btnLabels=document.getElementById('btnLabels');
  btnFly.addEventListener('click',()=>{tour?stopTour():startTour();});
  btnHome.addEventListener('click',()=>{card.hidden=true;flyTo(HOME.pos,HOME.tgt);});
  btnLabels.addEventListener('click',()=>{showLabels=!showLabels;btnLabels.setAttribute('aria-pressed',String(showLabels));labelsEl.hidden=!showLabels;});
  const tideRange=document.getElementById('tideRange'), tideVal=document.getElementById('tideVal');
  function setTide(){const t=tideRange.value/100; tideLevel=TIDE_LOW+(TIDE_HIGH-TIDE_LOW)*t; sea.position.y=tideLevel;
    tideVal.textContent=t>0.85?'pleine mer':t<0.15?'basse mer':t>0.5?'mi-marée haute':'mi-marée basse';}
  tideRange.addEventListener('input',setTide); setTide();

  // ---- boucle ----
  function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize); resize();
  const tmp=new THREE.Vector3(); let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(tween){const t=Math.min(1,(now-tween.start)/tween.dur),k=ease(t);
      camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k);
      const lift=Math.sin(Math.PI*k)*Math.min(120,tween.p0.distanceTo(tween.p1)*0.25); camera.position.y+=lift; if(t>=1)tween=null;}
    if(tour){const u=((now-tour.t0)/1000/90)%1; const p=tourCurve.getPointAt(u), ahead=tourCurve.getPointAt((u+0.02)%1);
      camera.position.copy(p); controls.target.set(ahead.x*0.6,0,ahead.z*0.6);}
    keyMove(dt);
    controls.update();
    if(!reduce){nTex.offset.x=(now*0.000012)%1; nTex.offset.y=(now*0.000007)%1;
      boats.forEach(b=>{const u=b.userData; b.position.y=tideLevel+Math.sin(now*0.0015+u.ph)*0.06; b.rotation.z=Math.sin(now*0.001+u.ph)*0.04;});
      const pts=window.__ferryPts; const fu=(now/1000/40)%2; const s=fu<1?fu:2-fu; const fi=s*(pts.length-1), i0=Math.floor(fi), a=fi-i0;
      const P=pts[Math.min(i0,pts.length-1)].clone().lerp(pts[Math.min(i0+1,pts.length-1)],a); ferry.position.set(P.x,tideLevel+0.05,P.z);
      const nxt=pts[Math.min(i0+1,pts.length-1)]; ferry.rotation.y=Math.atan2(-(nxt.z-P.z),(nxt.x-P.x))+(fu<1?0:Math.PI);
      avatarArm.rotation.z=-0.35+Math.sin(now*0.004)*0.25; const ring=beacon.getObjectByName('ring'); const pulse=1+((now/1400)%1)*0.9; ring.scale.set(pulse,pulse,pulse); ring.material.opacity=0.75*(1-((now/1400)%1));
    } else { boats.forEach(b=>{b.position.y=tideLevel;}); }
    renderer.render(scene,camera);
    if(showLabels){const w=window.innerWidth,h=window.innerHeight; const camDist=camera.position.distanceTo(controls.target);
      lbls.forEach(l=>{tmp.copy(l.v).project(camera); const dd=camera.position.distanceTo(l.v);
        const vis=tmp.z<1&&tmp.x>-1.1&&tmp.x<1.1&&tmp.y>-1.1&&tmp.y<1.1&&(l.pl.star||(l.pl.minor?dd<380:dd<Math.max(520,camDist*1.6)));
        if(!vis){l.el.style.display='none';return;} l.el.style.display='';
        l.el.style.left=((tmp.x+1)/2*w)+'px'; l.el.style.top=((1-tmp.y)/2*h)+'px'; l.el.style.zIndex=String(1000-Math.round(dd)); l.el.style.opacity=dd>700?0.6:1;});}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const ld=document.getElementById('loading'); ld.style.opacity=0; setTimeout(()=>ld.remove(),700);
  canvas.focus({preventScroll:true});
}
})();
</script>
